name: schoolos_app
description: Offline-first SkulGen client for Android, iPhone, iPad, and Windows desktop.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  cryptography: ^2.8.1
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.6.0
  http: ^1.6.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#082D5B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
