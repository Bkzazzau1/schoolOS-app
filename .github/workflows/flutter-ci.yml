name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release-build:
    # A release build with no --dart-define=API_BASE_URL compiles and ships
    # successfully: it just silently runs on demo data (lib/core/network/api_config.dart).
    # This job proves the real release-build pipeline actually works once that
    # flag is supplied, so "we forgot to pass it" is never discovered only after
    # a real build was already sent out. CI_API_BASE_URL is a placeholder until
    # a real backend domain exists (see docs/ACCOUNT_RECOVERY_CREDENTIAL_MANAGEMENT.md
    # and the launch-readiness tracker's external items); replace it with the
    # real `secrets.API_BASE_URL` once that domain is chosen.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Release build with a real API_BASE_URL
        run: flutter build windows --release --dart-define=API_BASE_URL=${{ vars.CI_API_BASE_URL || 'https://ci-placeholder.schoolos.invalid/api/v1' }}
