name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release-build:
    # A release build with no --dart-define=API_BASE_URL compiles and ships
    # successfully: it just silently runs on demo data (lib/core/network/api_config.dart).
    # This job proves the real release-build pipeline actually works once that
    # flag is supplied, so "we forgot to pass it" is never discovered only after
    # a real build was already sent out. Defaults to the real production API;
    # set the CI_API_BASE_URL repository variable to point builds at a
    # staging backend instead, without touching this file.
    runs-on: windows-latest
    env:
      # firebase_core's bundled firebase_cpp_sdk_windows ships a CMakeLists.txt whose own
      # cmake_minimum_required predates what modern CMake still accepts outright - this is the
      # upstream SDK's own file, not ours to edit. Without this, the Windows build fails at the
      # CMake configure step with "Compatibility with CMake < 3.5 has been removed".
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Release build with a real API_BASE_URL
        run: flutter build windows --release --dart-define=API_BASE_URL=${{ vars.CI_API_BASE_URL || 'https://api.skulgen.com/api/v1' }}
